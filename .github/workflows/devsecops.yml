name: DevSecOps Juice Shop

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets_scan:
    name: Secrets Scan - TruffleHog
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history with TruffleHog
        uses: trufflesecurity/trufflehog@f8221ca52ac51bf66228d6ec3691f3ea0782ae15
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown

  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-24.04
    needs: secrets_scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar 
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.sca.enabled=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  sca:
    name: SCA - Trivy Dependencies
    runs-on: ubuntu-24.04
    needs: secrets_scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate backend dependency lockfile
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Generate frontend dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Verify dependency lockfiles
        run: |
          test -f package-lock.json
          test -f frontend/package-lock.json
          echo "Both npm lockfiles generated successfully"


      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: error

      - name: Quality Gate - Trivy SCA
        run: |
          python3 security/check_sca_gate.py trivy-sca-report.json

  iac_scan:
    name: IaC Security - Checkov
    runs-on: ubuntu-24.04
    needs: secrets_scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Dockerfile and GitHub Actions
        run: |
          mkdir -p checkov-reports

          checkov -d . \
            --framework dockerfile github_actions \
            --output json \
            --output-file-path checkov-reports/checkov-report.json \
            --soft-fail

      - name: Quality Gate - Checkov IaC
        run: python3 security/check_checkov_gate.py

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-iac-report
          path: checkov-reports/
          if-no-files-found: error
  build:
    name: Build Juice Shop
    runs-on: ubuntu-latest
    needs: [sast, sca, iac_scan]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # Installation temporaire sans lockfile.
      # Le postinstall du dépôt lance lui-mÃªme
      # une installation frontend.
      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend and backend
        run: npm run build

  unit_tests:
    name: Unit Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run server unit tests
        run: npm run test:server

  frontend_tests:
    name: Frontend Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:frontend

  
  
  docker_build:
    name: Package
    runs-on: ubuntu-24.04
    needs: [unit_tests, frontend_tests]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop:devsecops .

      - name: Save Docker image
        run: docker save juice-shop:devsecops | gzip > juice-shop-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-docker-image
          path: juice-shop-image.tar.gz
          retention-days: 1
          if-no-files-found: error



  docker_scan:
    name: Docker Image Scan - Trivy
    runs-on: ubuntu-24.04
    needs: docker_build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:devsecops'
          scanners: 'vuln'
          vuln-type: 'os,library'
          format: 'json'
          output: 'trivy-docker-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Docker scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json
          if-no-files-found: error

      # NOUVEAU : Quality Gate Docker
      - name: Quality Gate - Trivy Docker
        run: python3 security/check_sca_gate.py trivy-docker-report.json

  sbom:
    name: SBOM - Syft CycloneDX
    runs-on: ubuntu-24.04
    needs: docker_build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: juice-shop:devsecops
          format: cyclonedx-json
          output-file: juice-shop-sbom.cdx.json
          artifact-name: juice-shop-sbom
          upload-artifact: true


      - name: Quality Gate - SBOM
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("juice-shop-sbom.cdx.json", encoding="utf-8") as f:
              sbom = json.load(f)

          components = sbom.get("components", [])

          # Les fichiers peuvent légitimement ne pas avoir de version.
          invalid = [
              c for c in components
              if not c.get("name")
              or (c.get("type") == "library" and not c.get("version"))
          ]

          print("Format:", sbom.get("bomFormat"))
          print("Components:", len(components))
          print("Invalid components:", len(invalid))

          if sbom.get("bomFormat") != "CycloneDX":
              sys.exit("QUALITY GATE FAILED: invalid SBOM format")

          if sbom.get("specVersion") != "1.6":
              sys.exit("QUALITY GATE FAILED: unexpected CycloneDX version")

          if not components:
              sys.exit("QUALITY GATE FAILED: empty SBOM")

          if invalid:
              sys.exit("QUALITY GATE FAILED: invalid component metadata")

          print("QUALITY GATE PASSED")
          PY

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-24.04
    needs: docker_build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Create Docker test network
        run: docker network create zapnet

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop-dast \
            --network zapnet \
            -p 127.0.0.1:3000:3000 \
            juice-shop:devsecops

      - name: Wait for Juice Shop to start
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs juice-shop-dast
          exit 1

      - name: Prepare ZAP reports directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network zapnet \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop-dast:3000 \
            -m 1 \
            -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: zap-reports/
          if-no-files-found: warn

      # NOUVEAU : Quality Gate DAST
      - name: Quality Gate - OWASP ZAP
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("zap-reports/zap-report.json")

          if not path.is_file():
              sys.exit("QUALITY GATE ERROR: rapport ZAP absent")

          try:
              with path.open(encoding="utf-8") as f:
                  report = json.load(f)
          except (OSError, ValueError) as error:
              sys.exit(f"QUALITY GATE ERROR: {error}")

          if not isinstance(report, dict) or not isinstance(report.get("site"), list) or not report["site"]:
              sys.exit("QUALITY GATE ERROR: aucun site analyse")

          high = [
              alert
              for site in report["site"]
              for alert in site.get("alerts", [])
              if str(alert.get("riskcode")) == "3"
          ]

          print("Alertes HIGH :", len(high))

          for alert in high:
              print("BLOCKED:", alert.get("name"))

          if high:
              sys.exit("QUALITY GATE FAILED")

          print("QUALITY GATE PASSED")
          PY

      - name: Stop Juice Shop
        if: always()
        run: |
          docker rm -f juice-shop-dast || true
          docker network rm zapnet || true

  publish_image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Publish Docker Image to Docker Hub
    runs-on: ubuntu-24.04
    needs: [docker_scan, sbom, dast]

    steps:
      - name: Download validated Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push validated image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/juice-shop-devsecops:${GITHUB_SHA}"

          docker tag juice-shop:devsecops "$IMAGE"
          docker push "$IMAGE"

          echo "Published: $IMAGE"

  deploy_staging:
    name: Deploy Staging - Docker Smoke Test
    runs-on: ubuntu-24.04
    needs: publish_image
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull validated image from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker pull "${DOCKERHUB_USERNAME}/juice-shop-devsecops:${GITHUB_SHA}"

      - name: Start isolated staging container
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker run -d --name juice-shop-staging \
            -p 127.0.0.1:3000:3000 \
            "${DOCKERHUB_USERNAME}/juice-shop-devsecops:${GITHUB_SHA}"

      - name: Smoke test deployed application
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /dev/null; then
              echo "STAGING SMOKE TEST PASSED"
              exit 0
            fi
            sleep 5
          done
          docker logs juice-shop-staging
          exit 1

      - name: Remove old Docker Hub tags after successful staging test
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_CLEANUP_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          namespace = os.environ["DOCKERHUB_USERNAME"]
          secret = os.environ["DOCKERHUB_CLEANUP_TOKEN"]
          if not secret:
              raise RuntimeError("Missing DOCKERHUB_CLEANUP_TOKEN GitHub secret")
          current = os.environ["GITHUB_SHA"]
          repository = "juice-shop-devsecops"
          base = (
              "https://hub.docker.com/v2/namespaces/"
              f"{urllib.parse.quote(namespace, safe='')}/repositories/"
              f"{repository}/tags"
          )

          def request_json(url, method="GET", payload=None, token=None):
              headers = {"Accept": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status == 204:
                      return None
                  body = response.read()
                  return json.loads(body) if body else None

          try:
              credentials = request_json(
                  "https://hub.docker.com/v2/auth/token",
                  method="POST",
                  payload={"identifier": namespace, "secret": secret},
              )
          except urllib.error.HTTPError as error:
              if error.code == 401:
                  raise RuntimeError(
                      "Docker Hub authentication rejected (401). Verify that "
                      "DOCKERHUB_CLEANUP_TOKEN is an active Docker Hub PAT "
                      "with Repo Read, Write, Delete permissions and that "
                      "DOCKERHUB_USERNAME matches its Docker ID."
                  ) from None
              raise
          token = credentials["access_token"]

          tags = []
          next_url = f"{base}?page_size=100"
          while next_url:
              parsed = urllib.parse.urlparse(next_url)
              if parsed.scheme != "https" or parsed.hostname != "hub.docker.com":
                  raise RuntimeError("Unexpected Docker Hub pagination URL")
              page = request_json(next_url, token=token)
              tags.extend(item["name"] for item in page["results"])
              next_url = page.get("next")

          # Ne jamais supprimer d'anciens tags si le nouveau manque.
          if current not in tags:
              raise RuntimeError("New image tag not found; cleanup aborted")

          old_tags = [tag for tag in tags if tag != current]
          print(f"Current tag retained: {current}")
          print(f"Old tags to delete: {len(old_tags)}")
          for tag in old_tags:
              endpoint = f"{base}/{urllib.parse.quote(tag, safe='')}"
              request_json(endpoint, method="DELETE", token=token)
              print(f"Deleted old tag: {tag}")

          print("Docker Hub cleanup completed")
          PYCODE

      - name: Remove staging container
        if: always()
        run: docker rm -f juice-shop-staging || true
  notify_slack:
    name: Slack - Pipeline Notification
    runs-on: ubuntu-24.04
    if: ${{ always() }}

    needs:
      - secrets_scan
      - sast
      - sca
      - iac_scan
      - build
      - unit_tests
      - frontend_tests
      - docker_build
      - docker_scan
      - sbom
      - dast
      - publish_image
      - deploy_staging

    steps:
      - name: Send Slack notification
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          jobs = json.loads(os.environ["NEEDS_JSON"])

          failed = [
              name for name, data in jobs.items()
              if data["result"] in ("failure", "cancelled")
          ]

          success = all(
              data["result"] == "success"
              for data in jobs.values()
          )

          status = "SUCCESS" if success else "FAILED"
          symbol = ":white_check_mark:" if success else ":x:"

          message = (
              f"{symbol} *DevSecOps Pipeline: {status}*\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Failed jobs: {', '.join(failed) if failed else 'None'}\n"
              f"Details: {os.environ['RUN_URL']}"
          )

          webhook = os.environ["SLACK_WEBHOOK_URL"]

          payload = json.dumps({"text": message}).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              print("Slack notification sent:", response.status)
          PY

  security_reporting:
    name: Grafana Loki - Security Reporting
    runs-on: ubuntu-24.04
    # Collect reports even when a security gate rejects the build.
    if: ${{ always() }}
    needs: [sca, iac_scan, docker_scan, dast]

    steps:
      - name: Download Trivy SCA report (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-sca-report
          path: security-reports/sca

      - name: Download Trivy Docker report (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-docker-report
          path: security-reports/docker

      - name: Download Checkov report (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkov-iac-report
          path: security-reports/checkov

      - name: Download ZAP report (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zap-dast-reports
          path: security-reports/zap

      - name: Export aggregated security findings to Grafana Loki
        # Observability must never turn a passing Quality Gate into a failure.
        continue-on-error: true
        env:
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER: ${{ secrets.GRAFANA_LOKI_USER }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
          SCAN_RESULTS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYCODE'
          import base64
          import collections
          import json
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          root = Path('security-reports')
          needs = json.loads(os.environ['SCAN_RESULTS'])
          severity_names = ('LOW', 'MEDIUM', 'HIGH', 'CRITICAL')
          specs = (
              ('trivy_sca', 'sca', root / 'sca/trivy-sca-report.json'),
              ('trivy_docker', 'docker_scan', root / 'docker/trivy-docker-report.json'),
              ('checkov', 'iac_scan', root / 'checkov/checkov-report.json'),
              ('zap', 'dast', root / 'zap/zap-report.json'),
          )

          def count_findings(scanner, document):
              counts = collections.Counter()
              if scanner.startswith('trivy_'):
                  if not isinstance(document, dict) or not isinstance(document.get('Results'), list):
                      raise ValueError('Trivy Results missing or invalid')
                  for result in document['Results']:
                      for vuln in result.get('Vulnerabilities') or []:
                          level = str(vuln.get('Severity', '')).upper()
                          if level in severity_names:
                              counts[level] += 1
              elif scanner == 'checkov':
                  reports = document if isinstance(document, list) else [document]
                  if not reports or any(not isinstance(r, dict) or not isinstance(r.get('results'), dict) for r in reports):
                      raise ValueError('Checkov results missing or invalid')
                  # Checkov findings here do not all carry a reliable severity.
                  counts['FAILED_CHECKS'] = sum(
                      len(r['results'].get('failed_checks') or []) for r in reports
                  )
              elif scanner == 'zap':
                  if not isinstance(document, dict) or not isinstance(document.get('site'), list):
                      raise ValueError('ZAP site list missing or invalid')
                  risks = {'0': 'INFO', '1': 'LOW', '2': 'MEDIUM', '3': 'HIGH'}
                  for site in document['site']:
                      for alert in site.get('alerts') or []:
                          level = risks.get(str(alert.get('riskcode')))
                          if level:
                              counts[level] += 1
              return counts

          entries = []
          now = time.time_ns()
          for index, (scanner, job_name, path) in enumerate(specs):
              event = {
                  'scanner': scanner,
                  'repository': os.environ['REPOSITORY'],
                  'run_id': os.environ['RUN_ID'],
                  'run_attempt': os.environ['RUN_ATTEMPT'],
                  'run_url': os.environ['RUN_URL'],
                  'commit': os.environ['COMMIT_SHA'],
                  'event': os.environ['EVENT_NAME'],
                  'job_result': needs.get(job_name, {}).get('result', 'unknown'),
                  'report_status': 'missing',
                  'low': None, 'medium': None,
                  'high': None, 'critical': None,
                  'info': None, 'failed_checks': None,
              }
              if path.is_file():
                  try:
                      document = json.loads(path.read_text(encoding='utf-8'))
                      counts = count_findings(scanner, document)
                      event.update({
                          'report_status': 'available',
                          'low': counts['LOW'],
                          'medium': counts['MEDIUM'],
                          'high': counts['HIGH'],
                          'critical': counts['CRITICAL'],
                          'info': counts['INFO'],
                          'failed_checks': counts['FAILED_CHECKS'] if scanner == 'checkov' else None,
                      })
                  except (ValueError, OSError, TypeError) as exc:
                      event['report_status'] = 'invalid'
                      print(f'{scanner}: unreadable report: {exc}')
              print(f"{scanner}: job={event['job_result']} report={event['report_status']} high={event['high']} critical={event['critical']}")
              entries.append({
                  'stream': {'job': 'devsecops_security', 'scanner': scanner},
                  'values': [[str(now + index), json.dumps(event, separators=(',', ':'))]],
              })

          url = os.environ.get('GRAFANA_LOKI_URL', '').strip().rstrip('/')
          user = os.environ.get('GRAFANA_LOKI_USER', '').strip()
          token = os.environ.get('GRAFANA_LOKI_TOKEN', '').strip()
          if not (url and user and token):
              raise RuntimeError('Missing Grafana Loki credentials (URL / USER / TOKEN)')
          if not url.endswith('/loki/api/v1/push'):
              url += '/loki/api/v1/push'
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.query or parsed.fragment:
              raise ValueError('GRAFANA_LOKI_URL must be an HTTPS Loki ingestion URL')

          credentials = base64.b64encode(f'{user}:{token}'.encode()).decode('ascii')
          request = urllib.request.Request(
              url,
              data=json.dumps({'streams': entries}).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': 'Basic ' + credentials,
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f'Unexpected Loki HTTP status: {response.status}')
                  print('Grafana Loki: 4 security summaries sent successfully')
          except urllib.error.HTTPError as exc:
              # Do not print response bodies, tokens or request headers.
              raise RuntimeError(f'Grafana Loki HTTP error {exc.code}; check Loki URL, instance ID and logs:write token') from None
          PYCODE
